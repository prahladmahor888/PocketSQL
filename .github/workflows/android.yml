name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── Debug build ── runs on every push/PR, no secrets needed ─────────────
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # ── Signed release build ── only runs when secrets are configured ────────
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    needs: build-debug
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Step 1: Decode the original PKCS12 keystore from the base64 secret
      - name: Decode PKCS12 keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/original.p12
          echo "Decoded PKCS12 size: $(wc -c < /tmp/original.p12) bytes"

      # Step 2: Convert PKCS12 → JKS (fixes 'Tag number over 30' ASN.1 error
      #         caused by newer PKCS12 encryption that older BouncyCastle can't parse)
      - name: Convert PKCS12 to JKS
        run: |
          keytool -importkeystore \
            -srckeystore /tmp/original.p12 \
            -srcstoretype PKCS12 \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -srckeypass "$KEY_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -destkeystore "${{ github.workspace }}/app/release.jks" \
            -deststoretype JKS \
            -deststorepass "$KEYSTORE_PASSWORD" \
            -destkeypass "$KEY_PASSWORD" \
            -destalias "$KEY_ALIAS" \
            -noprompt
          echo "KEYSTORE_FILE=${{ github.workspace }}/app/release.jks" >> $GITHUB_ENV

      # Step 3: Verify the JKS contents (shows alias names for debugging)
      - name: Verify JKS keystore
        run: |
          echo "=== Keystore contents ==="
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -v 2>&1 | grep -E "Alias|Entry type|Keystore type|contains" || true
          echo "=== KEYSTORE_FILE: $KEYSTORE_FILE ==="
          echo "=== KEY_ALIAS: $KEY_ALIAS ==="

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-signed
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

